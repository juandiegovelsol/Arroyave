<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Plataforma · Arroyave H. Litigio</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="app-body">
<a class="skip-link" href="#main">Saltar al contenido</a>
<div class="shell" id="shell">
  <aside class="sidebar" id="sidebar" aria-label="Navegación de la plataforma">
    <div class="sidebar-top">
      <a href="#/" class="sidebar-logo"><img src="/img/logo-compact-reversed.svg" alt="Arroyave H. Litigio · inicio de la plataforma"></a>
      <button class="icon-button sidebar-close" id="sidebar-close" type="button" aria-label="Cerrar navegación"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button>
    </div>
    <p class="sidebar-eyebrow" id="sidebar-eyebrow">Gestión de procesos</p>
    <nav id="nav" class="nav"></nav>
    <div class="sidebar-bottom">
      <span class="sidebar-rule"></span>
      <p class="sidebar-quote">Claridad jurídica.<br>Acompañamiento cercano.</p>
      <a href="/" class="sidebar-link">Ir al sitio web <span aria-hidden="true">↗</span></a>
    </div>
  </aside>
  <div class="backdrop" id="backdrop" hidden></div>
  <div class="main-col">
    <header class="topbar">
      <button class="icon-button menu-button" id="menu-button" type="button" aria-label="Abrir navegación" aria-expanded="false" aria-controls="sidebar"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <a href="#/" class="topbar-logo"><img src="/img/logo-compact.svg" alt="Arroyave H. Litigio"></a>
      <nav class="breadcrumb" id="breadcrumb" aria-label="Ubicación"></nav>
      <form class="global-search" id="global-search" role="search">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/></svg>
        <input type="search" name="q" placeholder="Buscar proceso, radicado o cliente" aria-label="Buscar procesos">
      </form>
      <div class="topbar-user">
        <button class="user-button" id="user-button" type="button" aria-haspopup="menu" aria-expanded="false">
          <span class="avatar" id="user-avatar" aria-hidden="true"></span>
          <span class="user-name" id="user-name"></span>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="user-menu" id="user-menu" role="menu" hidden>
          <a role="menuitem" href="#/perfil">Mi perfil y contraseña</a>
          <a role="menuitem" href="/">Ver sitio web</a>
          <button role="menuitem" type="button" id="logout">Cerrar sesión</button>
        </div>
      </div>
    </header>
    <main id="main" class="content" tabindex="-1"><div class="loading"><span class="spinner dark"></span> Cargando…</div></main>
    <footer class="app-footer"><span>Arroyave H. Litigio · Plataforma de gestión</span><span id="footer-note">Los estados internos no sustituyen la información oficial del despacho judicial.</span></footer>
  </div>
</div>
<div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>
<dialog id="modal" aria-labelledby="modal-title">
  <div class="dialog-top"><span class="eyebrow" id="modal-eyebrow"></span><button class="icon-button" id="modal-close" type="button" aria-label="Cerrar"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button></div>
  <h2 id="modal-title"></h2>
  <form id="modal-form" novalidate><div id="modal-body"></div><p id="modal-error" class="alert danger" role="alert" hidden></p><div class="dialog-actions" id="modal-actions"></div></form>
</dialog>
<script type="module" src="/app/js/app.js"></script>
</body>
</html>
